<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal To-Do App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .todo-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 4px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    button.add-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.add-btn:hover {
      background: var(--accent-hover);
    }
    ul#tasklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    li.task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: all 0.2s;
      cursor: pointer;
    }
    li.task-item:hover {
      border-color: #475569;
    }
    li.task-item.completed span.task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .checkbox {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    li.task-item.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }
    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }
    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="todo-card">
    <header>
      <h1>📝 To-Do List</h1>
      <p class="subtitle">Stay organized and get things done.</p>
    </header>

    <form class="input-group" onsubmit="event.preventDefault(); addtask();">
      <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off" />
      <button type="submit" class="add-btn">Add</button>
    </form>

    <ul id="tasklist"></ul>
    <div id="emptyState" class="empty-state">No tasks yet. Add one above!</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
